name: Deploy — Staging

on:
  push:
    branches: [develop]

  # Allow manual trigger for hotfix staging validation
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false   # Never cancel a running migration

jobs:
  validate:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Validate staging build configuration (fail-closed check)
        # This verifies that requireSupabase would NOT throw for staging builds
        # by confirming the secrets are present before attempting a build.
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "ERROR: SUPABASE_URL_STAGING secret is missing."
            echo "A staging build must not proceed without Supabase credentials."
            exit 1
          fi
          if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "ERROR: SUPABASE_PUBLISHABLE_KEY_STAGING secret is missing."
            exit 1
          fi
          echo "Staging credentials present — build may proceed."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_STAGING }}

  migrate-staging:
    name: Apply Migrations to Staging
    runs-on: ubuntu-latest
    needs: validate
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations to staging
        run: |
          supabase db push \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-functions-staging:
    name: Deploy Edge Functions to Staging
    runs-on: ubuntu-latest
    needs: migrate-staging
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy claim-reward \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"
          supabase functions deploy redeem-coins \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"
          supabase functions deploy grant-role \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Edge Function health
        run: |
          # Basic health check — functions should return 401 (unauthenticated),
          # not 404 (not deployed) or 500 (crashed).
          for fn in claim-reward redeem-coins grant-role; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              "https://${{ secrets.SUPABASE_PROJECT_REF_STAGING }}.functions.supabase.co/$fn")
            if [[ "$status" == "401" ]]; then
              echo "$fn: OK (401 unauthenticated as expected)"
            else
              echo "ERROR: $fn returned unexpected status $status"
              exit 1
            fi
          done
